{% extends "base.html" %}
{% block title %}새 문의 — 마케팅 CRM{% endblock %}
{% block content %}
<div class="page-header">
  <h1>새 문의 등록</h1>
  <a href="/inquiries" class="btn btn-secondary">← 목록</a>
</div>
<div class="card" style="max-width:600px">
  <form method="post" action="/inquiries/new">
    <div class="form-group">
      <label>고객 *</label>
      <select class="form-control" name="customer_id" required>
        <option value="">고객 선택</option>
        {% for c in customers %}
        <option value="{{ c.id }}">{{ c.name }} {% if c.email %}({{ c.email }}){% endif %}</option>
        {% endfor %}
      </select>
    </div>
    <div class="form-group">
      <label>채널</label>
      <select class="form-control" name="channel">
        {% for c in channels %}
        <option value="{{ c }}">{{ c }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="form-group">
      <label>제목</label>
      <input class="form-control" name="subject" placeholder="문의 제목"/>
    </div>
    <div class="form-group">
      <label>내용 *</label>
      <textarea class="form-control" name="content" required placeholder="문의 내용을 입력하세요..."></textarea>
    </div>
    <div class="form-group">
      <label>담당자</label>
      <input class="form-control" name="assigned_to" placeholder="담당자 이름"/>
    </div>
    <button class="btn btn-primary" type="submit">등록</button>
  </form>
</div>
{% endblock %}
